<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>个人风评 · HTML 原型</title>
<link rel='stylesheet' href='signal-shared.css'>
<style>
/* 本页局部关掉共享网格底纹（真实版用低透 SVG 纹理，不是死格子）。 */
.screen{background-image:none;padding-bottom:2rem}

/* 模块头：与世界态势一致的配方（eyebrow → 标题 → 收尾线）。 */
.head{position:relative;padding:3.25rem var(--pad) 1.25rem;overflow:hidden}
.head .eyebrow{margin:0 0 .375rem;color:var(--accent);font-family:'Helvetica Neue',Arial,'PingFang SC',system-ui,sans-serif;font-weight:800;font-size:.6875rem;letter-spacing:.22em}
.head h2{margin:0;font-size:2rem;font-weight:700;letter-spacing:.06em;line-height:1.12}
/* meta 仪表盘三层：英文标签 .k + 数字 .v + × 装饰分隔（参考事件追踪，删原收尾横线，补一条统计 meta）。 */
.head .meta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin:.75rem 0 0;color:var(--muted);font-size:.75rem;font-weight:400;letter-spacing:.04em}
.head .meta .k{font-size:.625rem;font-weight:700;letter-spacing:.14em;opacity:.72}
.head .meta .v{margin-left:.25rem;font-size:.6875rem;color:var(--sub)}
.head .meta .x{margin:0 .0625rem;font-size:.625rem;opacity:.4;vertical-align:.12em}
.head .meta svg{width:.875rem;height:.875rem;flex:0 0 auto}

/* 右上角装饰：雷达头像盘 + 竖排档案号（纯装饰，不绑数据）。
   档案号用直角引号「」包裹、竖排贴右边缘，雷达盘左移让出其宽度，二者左右并置。 */
.head-art{position:absolute;right:2rem;top:3.25rem;width:min(23%,5.75rem);aspect-ratio:1;opacity:.5;pointer-events:none}
.head-art svg{width:100%;height:100%}
.file-no{position:absolute;right:1rem;top:3.25rem;margin:0;color:var(--muted);font:500 .625rem/1.1 ui-monospace,monospace;letter-spacing:.1em;writing-mode:vertical-rl;text-orientation:upright}

/* 风评列表：对齐真实 reputation-entry 三列（编号 | 文案 | 5档尺子）。 */
.reviews{padding:0 var(--pad)}
.review{position:relative;display:grid;grid-template-columns:2.25rem minmax(0,1fr) 5.75rem;column-gap:1rem;align-items:start;padding:1.5rem 0;border-top:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.review:first-child{border-top:0}

/* 左侧图标框：L 角标 + 线性图标（纯装饰，对应真实编号位）。整体收小，弱化左列存在感。 */
.mark{position:relative;width:2.25rem;height:2.25rem;display:grid;place-items:center;color:var(--accent)}
.mark svg{width:1.125rem;height:1.125rem}
.mark::before,.mark::after{content:'';position:absolute;width:.5rem;height:.5rem;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.mark::before{left:0;top:0;border-right:0;border-bottom:0}
.mark::after{right:0;bottom:0;border-left:0;border-top:0}

/* 文案列：左侧一条细竖线（对齐真实 entry 的分隔感）。 */
.copy{min-width:0;padding-left:1rem;border-left:1px solid color-mix(in srgb,var(--accent) 34%,transparent)}

.copy header{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.copy h3{margin:0;font-size:1rem;font-weight:600;letter-spacing:.01em}
.copy p{margin:.5rem 0 0;color:var(--sub);font-size:.875rem;line-height:1.65}
/* 状态徽章：对齐真实 statusBadge（固定 5 值之一）。移到右列 meter 正上方，与刻度同列成一组。 */
.badge{display:inline-flex;align-items:center;min-height:1.25rem;padding:.0625rem .5rem;border:1px solid color-mix(in srgb,var(--accent) 52%,transparent);border-radius:99px;color:var(--accent);font-size:.6875rem;white-space:nowrap}

/* 右列评级组：badge（文字等级）在左 + meter（刻度等级）在右，同一行水平排列，badge 顶对齐。
   撑满卡片高度，让内部 meter 有高度可铺满，避免 dots 被压扁。 */
.rating{align-self:stretch;display:flex;flex-direction:row;align-items:flex-start;justify-content:flex-end;gap:.625rem}

/* 尺子 meter：纯视觉刻度，零文字。左→右两列 = 刻度短横 | 圆点游标，5 行等分跟随卡片高度。
   刻度一律为纯装饰淡灰、不上主题色；等级只靠圆点游标表达（当前档 = 实心 accent 圆点 + 光晕，
   其余档 = 空心淡灰小点）+ 竖向位置（上=最高档信任，下=最低档敌对）。文字等级交给左侧 badge。 */
.meter{display:grid;grid-template-rows:repeat(5,1fr);height:6.5rem}
.meter span{display:grid;grid-template-columns:1.25rem .5rem;align-items:center;column-gap:.625rem;justify-content:end}
/* 刻度：短横线，右对齐成一条竖直刻度边，纯装饰同色。显式钉在 row1，避免与圆点分行错位 */
.meter i{grid-column:1;grid-row:1;justify-self:end;width:.875rem;height:1px;background:var(--meter-muted)}
/* 圆点游标：默认空心淡灰小点，与刻度同在 row1 居中对齐 */
.meter span::before{content:'';grid-column:2;grid-row:1;justify-self:center;width:.4375rem;height:.4375rem;border-radius:50%;box-sizing:border-box;border:1px solid var(--meter-muted);background:var(--card)}
/* 当前档：仅圆点变实心 accent + 光晕，刻度不变色 */
.meter .on::before{width:.5rem;height:.5rem;border-color:var(--accent);background:var(--accent);box-shadow:0 0 0 .1875rem color-mix(in srgb,var(--accent) 16%,transparent)}


/* 底部收尾：极简档案封存标记。中央一枚细线同心圆章（内「封存」二字 + 环上小星，呼应头部雷达盘），
   两侧对称破折线牵引，下方「报告至此」小字。克制、对称、与全页线条语言同源。 */
.foot-art{position:relative;height:8rem;margin-top:1.75rem;overflow:hidden;pointer-events:none;color:var(--accent-soft)}
.foot-art svg{width:100%;height:100%}
</style>
</head>
<body>
<main class='phone'><div class='screen'>

<section class='head' aria-label='个人风评概览'>
  <div class='head-art' aria-hidden='true'><svg viewBox='0 0 120 120' fill='none' stroke='currentColor' stroke-width='1' vector-effect='non-scaling-stroke'>
    <circle cx='60' cy='60' r='57' stroke-dasharray='1 4' opacity='.6'/>
    <circle cx='60' cy='60' r='44' stroke-dasharray='2 3' opacity='.5'/>
    <circle cx='60' cy='60' r='30'/>
    <path d='M60 18v8M60 94v8M18 60h8M94 60h8'/>
    <circle cx='60' cy='52' r='9' fill='currentColor' stroke='none' opacity='.5'/>
    <path d='M44 78c3-9 8-13 16-13s13 4 16 13' fill='currentColor' stroke='none' opacity='.5'/>
  </svg></div>
  <p class='file-no' aria-hidden='true'>「PRS-240502」</p>
  <p class='eyebrow'>PUBLIC OPINION</p>
  <h2>个人风评</h2>
  <p class='meta'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3.5 2'/></svg><span class='k'>PEOPLE</span><span class='v'>4</span><span class='x'>&times;</span><span class='k'>GOOD</span><span class='v'>2</span><span class='x'>&times;</span><span class='k'>BAD</span><span class='v'>1</span></p>
</section>

<section class='reviews' aria-label='风评报告'>
  <article class='review'>
    <div class='mark' aria-hidden='true'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M7 17L17 7M9 7h8v8'/></svg></div>
    <div class='copy'>
      <header><h3>北川</h3></header>
      <p>近期多次协助其完成情报核查，彼此间信任度持续提升。对你的判断与行动给予积极评价。</p>
    </div>
    <div class='rating'>
      <span class='badge'>信任</span>
      <div class='meter' role='img' aria-label='好感度：信任（最高档）'>
        <span class='on'><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span>
      </div>
    </div>
  </article>
  <article class='review'>
    <div class='mark' aria-hidden='true'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><circle cx='8' cy='8' r='2.6'/><circle cx='16' cy='8' r='2.6'/><path d='M4 19c0-3 1.8-5 4-5s4 2 4 5M12 19c0-3 1.8-5 4-5s4 2 4 5'/></svg></div>
    <div class='copy'>
      <header><h3>巡航组</h3></header>
      <p>对你的行动仍保持观察，尚未完全放下戒心。合作以任务为导向，私人层面接触有限。</p>
    </div>
    <div class='rating'>
      <span class='badge'>中立</span>
      <div class='meter' role='img' aria-label='好感度：中立（居中档）'>
        <span><i></i></span><span><i></i></span><span class='on'><i></i></span><span><i></i></span><span><i></i></span>
      </div>
    </div>
  </article>
  <article class='review'>
    <div class='mark' aria-hidden='true'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z'/><circle cx='12' cy='12' r='2.6'/></svg></div>
    <div class='copy'>
      <header><h3>雾港联络人</h3></header>
      <p>对你的真实目的仍有疑虑，沟通时态度谨慎。建议保持信息透明，逐步建立可靠印象。</p>
    </div>
    <div class='rating'>
      <span class='badge'>厌恶</span>
      <div class='meter' role='img' aria-label='好感度：厌恶（偏低档）'>
        <span><i></i></span><span><i></i></span><span><i></i></span><span class='on'><i></i></span><span><i></i></span>
      </div>
    </div>
  </article>
  <article class='review'>
    <div class='mark' aria-hidden='true'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3l7 3v5c0 4.4-3 7.8-7 9-4-1.2-7-4.6-7-9V6z'/><path d='M9 12l2 2 4-4.5'/></svg></div>
    <div class='copy'>
      <header><h3>旧城区居民</h3></header>
      <p>日常接触友善，未出现明显负面反馈。你在社区中的声望维持在稳定水平。</p>
    </div>
    <div class='rating'>
      <span class='badge'>喜爱</span>
      <div class='meter' role='img' aria-label='好感度：喜爱（偏高档）'>
        <span><i></i></span><span class='on'><i></i></span><span><i></i></span><span><i></i></span><span><i></i></span>
      </div>
    </div>
  </article>
</section>

<div class='foot-art' aria-hidden='true'><svg viewBox='0 0 390 128' fill='none' stroke='currentColor' preserveAspectRatio='xMidYMid meet' vector-effect='non-scaling-stroke'>
  <!-- 两侧对称破折线：向中央准星牵引，端点小圆渐隐（端点内移贴近缩小后的准星） -->
  <g stroke-width='.9'>
    <path d='M70 64H166' opacity='.4'/>
    <path d='M224 64H320' opacity='.4'/>
    <circle cx='70' cy='64' r='1.4' fill='currentColor' stroke='none' opacity='.32'/>
    <circle cx='320' cy='64' r='1.4' fill='currentColor' stroke='none' opacity='.32'/>
  </g>
  <!-- 瞄准镜准星（整体缩小 1/2）：实线双环，干净利落，无虚线毛边 -->
  <circle cx='195' cy='64' r='16.5' stroke-width='.9' opacity='.5'/>
  <circle cx='195' cy='64' r='10' stroke-width='1' opacity='.6'/>
  <!-- 十字准星：竖横两线贯穿内外环，中心留空断口，四端探出外环成瞄准刻度 -->
  <g stroke-width='1' stroke-linecap='round' opacity='.6'>
    <path d='M195 43V57M195 71V85'/>
    <path d='M174 64H188M202 64H216'/>
  </g>
  <!-- 中心靶点 -->
  <circle cx='195' cy='64' r='1.3' fill='currentColor' stroke='none' opacity='.75'/>
  <!-- 下方「报告至此」小字 -->
  <text x='195' y='112' text-anchor='middle' fill='currentColor' stroke='none' font-family='ui-monospace,monospace' font-size='8' letter-spacing='4' opacity='.5'>报 告 至 此</text>
</svg></div>

</div></main>
</body>
</html>
