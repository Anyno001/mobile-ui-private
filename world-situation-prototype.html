<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界态势 · HTML 原型</title>
<link rel="stylesheet" href="signal-shared.css">
<style>
/* 本页局部关掉共享的满屏网格底纹：真实版用的是低透 SVG 纹理，不是死格子。
   同时去掉 tab 栏预留的底部空间（本原型已删底部导航）。
   --rail：所有节点 marker 与竖线共用的轨道 x，保证 hero 与 signals 连成一条线。 */
.screen{background-image:none;padding-bottom:2rem;--rail:calc(var(--pad) + .5rem)}

/* 模块头：eyebrow → 标题 → 收尾线 → meta。对齐 trendModuleHead 的字段。 */
.head{position:relative;padding:3.25rem var(--pad) 1.25rem;overflow:hidden}
.head-art{position:absolute;right:0;top:1.5rem;width:min(46%,12.5rem);aspect-ratio:1;color:var(--accent-soft);opacity:.6;pointer-events:none}
/* eyebrow 改实心几何无衬线 + 加粗，字距收紧；字号最小、贴近标题。 */
.head .eyebrow{margin:0 0 .375rem;font-family:"Helvetica Neue",Arial,"PingFang SC",system-ui,sans-serif;font-weight:800;font-size:.6875rem;letter-spacing:.22em}
.head h2{margin:0;font-size:2rem;font-weight:700;letter-spacing:.06em;line-height:1.12}
/* meta 仪表盘三层：英文标签 .k + 数字 .v + × 装饰分隔（参考事件追踪，删原收尾横线）。 */
.head .meta .k{font-size:.625rem;font-weight:700;letter-spacing:.14em;opacity:.72}
.head .meta .v{margin-left:.25rem;font-size:.6875rem;color:var(--sub)}
.head .meta .x{margin:0 .0625rem;font-size:.625rem;opacity:.4;vertical-align:.12em}
/* meta 行：时钟 SVG + 精简排版，整体细体、同一字重与颜色。
   时钟对应真实字段 operation.lastSuccessfulRunAt。 */
.head .meta{display:flex;align-items:center;gap:.5rem;margin:.75rem 0 0;color:var(--muted);font-size:.75rem;font-weight:400;letter-spacing:.04em}
.head .meta svg{width:.875rem;height:.875rem;flex:0 0 auto}
.head .meta .sep{opacity:.6}

/* 节点 marker：取真实 .pm-today-trend-world-signal-marker 的圆环样式，但去掉指向文字的短横线。
   2px accent 圆环 + 外圈柔光晕 + 中心小点，全部落在同一条左轨 --rail 上，并与各自标题行垂直对齐。 */
.knot{position:absolute;left:var(--rail);display:grid;place-items:center;width:.9375rem;height:.9375rem;border:2px solid var(--accent);border-radius:50%;background:var(--paper);box-shadow:0 0 0 .25rem color-mix(in srgb,var(--accent) 14%,transparent);transform:translateX(-50%)}
.knot i{width:.4375rem;height:.4375rem;border-radius:50%;background:var(--accent)}

/* hero：第一条世界态势项目，作为唯一放大的头条。对应 items[0]。
   真实版 hero 用 --pm-today-trend-display-size:clamp(22px,7vw,30px)，是全场最大元素。
   ::after 为 hero 竖虚线，向下延伸与 signals 竖线相接，连成一条轨道。 */
.hero-item{position:relative;padding:1.75rem var(--pad) 2rem calc(var(--rail) + 1.75rem)}
/* 圆点垂直对齐 hero 标题首行中心：padding-top 1.75rem + 标题半行高 - 圆点半径。 */
.hero-item .knot{top:2.55rem}
.hero-item::after{content:"";position:absolute;top:3rem;bottom:-2rem;left:var(--rail);border-left:1px dashed color-mix(in srgb,var(--accent) 56%,transparent);pointer-events:none}
.hero-item h3{margin:0;max-width:84%;font-size:2.125rem;font-weight:700;letter-spacing:.01em;line-height:1.22}
.hero-item p{margin:.875rem 0 0;max-width:80%;color:var(--sub);font-size:.9375rem;line-height:1.7}

/* signals：其余项目。signals 不吃左 padding，使 .sig 左边缘对齐屏幕左，
   knot 的 left:var(--rail) 才能落在主竖线上；内容缩进交给 .sig 自身 padding。
   右侧项仅加大内容缩进做错落，marker 因 padding 不影响绝对定位而仍留主轨（对齐真实 is-right）。 */
.signals{position:relative;padding:0}
.signals::before{content:"";position:absolute;top:0;bottom:2rem;left:var(--rail);border-left:1px dashed color-mix(in srgb,var(--accent) 56%,transparent);pointer-events:none}
.sig{position:relative;margin-bottom:2.5rem;padding:0 var(--pad) 0 calc(var(--rail) + 1.5rem)}
.sig.right{padding-left:calc(var(--rail) + 4.5rem)}
/* 右侧项圆点脱离主轨，跟到右移文字左侧，与左侧项保持同样的点字间距（1.5rem）。 */
.sig.right .knot{left:calc(var(--rail) + 3rem)}
.sig .knot{top:.125rem}
.sig h3{margin:0;font-size:1rem;font-weight:600;letter-spacing:.01em}
.sig p{margin:.5rem 0 0;color:var(--sub);font-size:.875rem;line-height:1.65}
.sig .tail{display:inline-block;width:4rem;margin-top:.75rem;border-top:1px dotted var(--accent-soft)}

.footer-art{position:relative;height:8rem;margin-top:.5rem;color:var(--accent-soft);opacity:.5}
.footer-art svg{width:100%;height:100%}
</style>
</head>
<body>
<main class="phone"><div class="screen">

<section class="head" aria-label="世界态势概览">
  <!-- 头图：球面经纬网格的一角。圆心外推到右上角外更远处、半径放大，露出更大一片交叉弧线，
       读作抽象「全局经纬」线网纹理（非完整地球图标）。全部为正圆与规则椭圆，同心，数学对称。
       专属「世界 / 全局」意象，区别于风评同心正圆、势力流动散点、事件环+芯节点。 -->
  <div class="head-art" aria-hidden="true"><svg viewBox="0 0 260 130" fill="none" stroke="currentColor" vector-effect="non-scaling-stroke">
    <!-- 球体外缘弧（=最外经线圈），圆心 (268,2) 更靠角外、r 放大到 128，入画弧面更大 -->
    <circle cx="268" cy="2" r="128" stroke-width="1" opacity=".5"/>
    <!-- 纬线：横椭圆，ry 递减，内圈虚线渐隐 -->
    <ellipse cx="268" cy="2" rx="128" ry="86" stroke-width=".8" opacity=".34"/>
    <ellipse cx="268" cy="2" rx="128" ry="44" stroke-width=".7" stroke-dasharray="3 5" opacity=".22"/>
    <!-- 经线：竖椭圆，rx 递减 -->
    <ellipse cx="268" cy="2" rx="86" ry="128" stroke-width=".8" opacity=".34"/>
    <ellipse cx="268" cy="2" rx="44" ry="128" stroke-width=".7" stroke-dasharray="3 5" opacity=".22"/>
    <!-- 网格交点上一枚信号节点（呼应页面 .knot），落在赤道弧与经线交会附近 -->
    <circle cx="182" cy="2" r="2" fill="currentColor" stroke="none" opacity=".5"/>
    <!-- 左中空白区一枚游离「坐标信号点」：mini 环+芯 + 一小段朝网格方向的虚线引出。
         刻意偏离中心、比网格更小更淡，打破与右下角的对称，轻点空白。 -->
    <circle cx="70" cy="52" r="4" stroke-width=".8" opacity=".4"/>
    <circle cx="70" cy="52" r="1.2" fill="currentColor" stroke="none" opacity=".5"/>
    <path d="M74 49L110 30" stroke-width=".6" stroke-dasharray="2 4" opacity=".3"/>
    <circle cx="46" cy="70" r="1" fill="currentColor" stroke="none" opacity=".3"/>
  </svg></div>
  <p class="eyebrow">TODAY&rsquo;S SIGNAL</p>
  <h2>世界态势</h2>
  <p class="meta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg><span class="v">09:30</span><span class="x">&times;</span><span class="k">NEWS</span><span class="v">4</span><span class="x">&times;</span><span class="k">ALERTS</span><span class="v">3</span></p>
</section>

<article class="hero-item" aria-label="世界态势主项">
  <span class="knot" aria-hidden="true"><i></i></span>
  <h3>区域信号保持平稳</h3>
  <p>主要区域运行节奏保持一致，未观测到显著偏离或异常聚集。</p>
</article>

<section class="signals" aria-label="区域信号">
  <article class="sig">
    <span class="knot" aria-hidden="true"><i></i></span>
    <h3>海上航线出现低频扰动</h3>
    <p>部分航线出现间歇性信号波动，影响范围有限，持续关注中。</p>
    <span class="tail" aria-hidden="true"></span>
  </article>
  <article class="sig right">
    <span class="knot" aria-hidden="true"><i></i></span>
    <h3>公共议题热度缓慢回落</h3>
    <p>整体讨论热度温和下降，核心议题仍在低位延续。</p>
    <span class="tail" aria-hidden="true"></span>
  </article>
  <article class="sig">
    <span class="knot" aria-hidden="true"><i></i></span>
    <h3>跨境协作进入观察窗口</h3>
    <p>多方沟通频率小幅提升，合作意向处于初步探索阶段。</p>
    <span class="tail" aria-hidden="true"></span>
  </article>
</section>
<!-- 尾图：与头部同一套球面经纬网格母题，圆心放在左下角外侧（头部在右上角外），
     网格从左下扫入，与头部对角呼应。全部正圆与规则椭圆，同心、数学对称。 -->
<div class="footer-art" aria-hidden="true"><svg viewBox="0 0 390 144" fill="none" stroke="currentColor" preserveAspectRatio="xMidYMax meet" vector-effect="non-scaling-stroke">
  <!-- 球体外缘弧（=最外经线圈），圆心 (-12,156) 在左下角外，右上弧入画 -->
  <circle cx="-12" cy="156" r="190" stroke-width="1" opacity=".5"/>
  <!-- 纬线：横椭圆，ry 递减，内圈虚线渐隐 -->
  <ellipse cx="-12" cy="156" rx="190" ry="128" stroke-width=".8" opacity=".34"/>
  <ellipse cx="-12" cy="156" rx="190" ry="66" stroke-width=".7" stroke-dasharray="3 5" opacity=".22"/>
  <!-- 经线：竖椭圆，rx 递减 -->
  <ellipse cx="-12" cy="156" rx="128" ry="190" stroke-width=".8" opacity=".34"/>
  <ellipse cx="-12" cy="156" rx="66" ry="190" stroke-width=".7" stroke-dasharray="3 5" opacity=".22"/>
  <!-- 网格交点上一枚信号节点（呼应页面 .knot），落在经线弧上 -->
  <circle cx="-12" cy="28" r="2" fill="currentColor" stroke="none" opacity=".5"/>
</svg></div>


</div></main>
</body>
</html>
